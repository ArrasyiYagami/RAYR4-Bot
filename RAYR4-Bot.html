<style>
/* ============ RAYR4 DESIGN SYSTEM — NEO-BRUTALISM × PLAYFUL POP ============ */
:root{
  --paper:#FFFFFF; --soft:#FFF7FB; --ink:#111111;
  --pink:#FF8FBF; --pink-hot:#FF6FA8; --pink-pastel:#FFD6E8;
  --yellow:#FFE55C; --mint:#A8E6CF; --lav:#B8A9FF;
  --red:#FF4747; --green:#2FBF71; --warn:#FFC53D;
  --shadow:#111111; --bw:3px; --bw2:4px;
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
}
body.night{
  --paper:#17171B; --soft:#0E0E11; --ink:#F2F2F2;
  --pink:#FF8FBF; --pink-hot:#FF5FA2; --pink-pastel:#3A2A33;
  --yellow:#FFE55C; --mint:#7FDDBB; --lav:#CBBBFF;
  --shadow:#FF8FBF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0; background:var(--soft); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; padding-bottom:76px}
@media(min-width:920px){body{padding-bottom:24px}}
h1,h2,h3,h4{font-family:var(--f-display); line-height:1.15; margin:0 0 6px}
h1{font-size:26px; font-weight:700; letter-spacing:-.5px}
h2{font-size:19px; font-weight:700}
h3{font-size:16px; font-weight:600}
p{margin:0 0 10px}
a{color:var(--pink-hot); font-weight:600}
button{font-family:inherit}
img{max-width:100%}
.skip{position:absolute; left:-9999px; top:0; background:var(--yellow); border:var(--bw) solid var(--ink); padding:8px 14px; z-index:200; font-weight:800}
.skip:focus{left:8px; top:8px}
:focus-visible{outline:3px solid var(--pink-hot); outline-offset:2px; border-radius:4px}
::selection{background:var(--yellow); color:#111}

/* ---------- layout ---------- */
#app{max-width:1080px; margin:0 auto; padding:14px 14px 40px}
#side{display:none; align-self:start; position:sticky; top:18px}
@media(min-width:920px){
  #app{display:grid; grid-template-columns:216px 1fr; gap:22px; max-width:1180px; padding-top:22px}
  #side{display:block}
}
#view{min-height:60vh}
#view.enter{animation:viewin .3s ease-out}
@keyframes viewin{from{opacity:0; transform:translateX(22px)} to{opacity:1; transform:none}}
.mt1{margin-top:8px}.mt2{margin-top:14px}.mt3{margin-top:22px}.mb1{margin-bottom:8px}.mb2{margin-bottom:14px}
.row{display:flex; gap:10px; align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex; gap:10px; align-items:center; justify-content:space-between}
.grid2{display:grid; grid-template-columns:1fr; gap:14px}
.grid4{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:repeat(4,1fr)}}
.muted{opacity:.65; font-size:13px}
.small{font-size:12px}
.big-num{font-family:var(--f-display); font-weight:700; font-size:34px; letter-spacing:-1px; line-height:1}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* ---------- brutal primitives ---------- */
.card{background:var(--paper); border:var(--bw) solid var(--ink); border-radius:4px; box-shadow:6px 6px 0 var(--shadow); padding:16px}
.card.pad-sm{padding:12px}
.card-soft{background:var(--pink-pastel)}
.card-lav{background:var(--lav)}
.card-mint{background:var(--mint)}
.card-yellow{background:var(--yellow)}
.card-flat{box-shadow:none}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:var(--bw) solid var(--ink); background:var(--paper); color:var(--ink); font-weight:800; font-size:14px; padding:10px 16px; border-radius:4px; box-shadow:4px 4px 0 var(--shadow); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; text-decoration:none; line-height:1.2}
.btn:hover{transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--shadow)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:4px 4px 0 var(--shadow)}
.btn-pink{background:var(--pink)} .btn-hot{background:var(--pink-hot); color:#fff}
.btn-yellow{background:var(--yellow)} .btn-mint{background:var(--mint)} .btn-lav{background:var(--lav)}
.btn-danger{background:var(--red); color:#fff}
.btn-ink{background:var(--ink); color:#fff}
body.night .btn-ink{color:var(--ink); background:var(--pink-pastel)}
.btn-sm{padding:6px 10px; font-size:12px; box-shadow:3px 3px 0 var(--shadow); border-width:2px}
.btn-icon{padding:8px; box-shadow:3px 3px 0 var(--shadow)}
.btn-big{padding:16px 12px; flex-direction:column; gap:6px; font-size:14px; width:100%}
.btn-big svg{width:26px; height:26px}
.sticker{display:inline-block; background:var(--yellow); color:#111; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--shadow); padding:3px 10px; font-weight:800; font-size:11px; letter-spacing:.5px; text-transform:uppercase; transform:rotate(-3deg)}
.sticker.pink{background:var(--pink)} .sticker.mint{background:var(--mint); transform:rotate(2deg)} .sticker.lav{background:var(--lav); transform:rotate(-2deg)}
.sticker.red{background:var(--red); color:#fff}
.badge{display:inline-flex; align-items:center; gap:4px; border:2px solid var(--ink); padding:2px 8px; font-size:11px; font-weight:800; border-radius:999px; background:var(--paper)}
.badge.high{background:var(--red); color:#fff} .badge.med{background:var(--yellow)} .badge.low{background:var(--mint)}
.chip{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); background:var(--paper); padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; box-shadow:2px 2px 0 var(--shadow); transition:transform .1s}
.chip:active{transform:translate(2px,2px); box-shadow:none}
.chip.on{background:var(--ink); color:#fff}
body.night .chip.on{background:var(--pink); color:#111}

/* ---------- form ---------- */
label.fld{display:block; font-size:12px; font-weight:800; margin:10px 0 4px; text-transform:uppercase; letter-spacing:.5px}
input,select,textarea{width:100%; border:var(--bw) solid var(--ink); border-radius:4px; background:var(--paper); color:var(--ink); padding:10px 12px; font:inherit; font-weight:600}
textarea{resize:vertical; min-height:70px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--pink-hot); outline-offset:1px}
input[type=file]{padding:8px}
select{-webkit-appearance:none; appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23111' stroke-width='2.5'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px}
input[type=range]{-webkit-appearance:none; appearance:none; height:26px; padding:0; border:none; background:transparent; box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:10px; background:var(--paper); border:var(--bw) solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; margin-top:-11px; background:var(--pink); border:var(--bw) solid var(--ink); box-shadow:2px 2px 0 var(--ink); cursor:grab}
input[type=checkbox].real{width:auto; accent-color:var(--pink-hot); width:18px; height:18px}
.frm{display:grid; grid-template-columns:1fr; gap:0 12px}
@media(min-width:600px){.frm.c2{grid-template-columns:1fr 1fr}.frm.c3{grid-template-columns:2fr 1fr 1fr}}

/* ---------- progress / skeleton / toasts ---------- */
.progress{height:20px; border:var(--bw) solid var(--ink); border-radius:4px; background:var(--paper); overflow:hidden; box-shadow:inset 2px 2px 0 rgba(17,17,17,.08)}
.progress>span{display:block; height:100%; background:repeating-linear-gradient(-45deg, var(--pink) 0 12px, var(--pink-pastel) 12px 24px); transition:width .5s cubic-bezier(.2,1,.3,1); border-right:var(--bw) solid var(--ink)}
.progress.thin{height:14px}
.progress.p-mint>span{background:repeating-linear-gradient(-45deg, var(--mint) 0 12px, #d9f3e8 12px 24px)}
.progress.p-yellow>span{background:repeating-linear-gradient(-45deg, var(--yellow) 0 12px, #fff2b0 12px 24px)}
.progress.p-red>span{background:repeating-linear-gradient(-45deg, var(--red) 0 12px, #ff8a8a 12px 24px)}
.skel{background:var(--ink); border-radius:4px; animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
#toast-root{position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:120; display:flex; flex-direction:column; gap:10px; width:min(94vw,420px)}
.toast{background:var(--ink); color:#fff; border:var(--bw) solid var(--ink); box-shadow:5px 5px 0 var(--pink); border-radius:4px; padding:12px 14px; font-weight:700; font-size:13px; display:flex; gap:10px; align-items:flex-start; animation:toastin .45s cubic-bezier(.2,1.6,.4,1)}
.toast.ok{background:var(--mint); color:#111; box-shadow:5px 5px 0 var(--ink)}
.toast.warn{background:var(--yellow); color:#111; box-shadow:5px 5px 0 var(--ink)}
.toast.err{background:var(--red); color:#fff; box-shadow:5px 5px 0 var(--ink)}
@keyframes toastin{from{transform:translateY(-140%)} 60%{transform:translateY(10%)} to{transform:translateY(0)}}
.toast.out{animation:toastout .3s ease-in forwards}
@keyframes toastout{to{opacity:0; transform:translateY(-120%)}}

/* ---------- modal ---------- */
#modal-root:empty{display:none}
.overlay{position:fixed; inset:0; background:rgba(17,17,17,.55); z-index:110; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadein .2s ease-out}
@keyframes fadein{from{opacity:0}}
.modal{background:var(--paper); border:var(--bw2) solid var(--ink); border-radius:4px; box-shadow:10px 10px 0 var(--shadow); width:min(94vw,520px); max-height:86vh; overflow:auto; padding:20px; animation:popin .3s cubic-bezier(.2,1.4,.3,1)}
@keyframes popin{from{opacity:0; transform:scale(.9) translateY(14px)}}
.modal h2{margin-bottom:12px}

/* ---------- nav ---------- */
#bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:90; background:var(--paper); border-top:var(--bw2) solid var(--ink); display:flex; overflow-x:auto; scrollbar-width:none; padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bottomnav::-webkit-scrollbar{display:none}
@media(min-width:920px){#bottomnav{display:none}}
#bottomnav a{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:64px; padding:6px 8px; border:var(--bw) solid transparent; border-radius:4px; text-decoration:none; color:var(--ink); font-size:10px; font-weight:800; margin:0 2px}
#bottomnav a svg{width:20px; height:20px}
#bottomnav a.on{background:var(--pink); border-color:var(--ink); box-shadow:2px 2px 0 var(--ink)}
#side .logo{display:flex; align-items:center; gap:10px; margin-bottom:18px}
.logo-mark{width:44px; height:44px; background:var(--pink); border:var(--bw) solid var(--ink); box-shadow:4px 4px 0 var(--shadow); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:17px; transform:rotate(-4deg)}
#side nav{display:flex; flex-direction:column; gap:6px}
#side nav a{display:flex; align-items:center; gap:10px; padding:9px 12px; border:var(--bw) solid var(--ink); border-radius:4px; background:var(--paper); color:var(--ink); text-decoration:none; font-weight:700; font-size:13px; box-shadow:3px 3px 0 var(--shadow); transition:transform .1s}
#side nav a svg{width:17px; height:17px; flex:0 0 auto}
#side nav a.on{background:var(--ink); color:#fff}
body.night #side nav a.on{background:var(--pink); color:#111}
#side nav a:active{transform:translate(2px,2px); box-shadow:none}

/* ---------- dashboard ---------- */
.hello{font-size:15px; font-weight:600}
.hello b{font-family:var(--f-display); font-size:17px}
.kpi{display:flex; flex-direction:column; gap:2px}
.kpi .lab{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; opacity:.7}
.qbtn svg{width:26px; height:26px}
.qbtn .qn{font-size:13px; font-weight:800}
.pct{font-family:var(--f-display); font-weight:700; font-size:44px; letter-spacing:-2px; line-height:1}

/* ---------- todos ---------- */
.todo{display:flex; gap:10px; align-items:flex-start; background:var(--paper); border:var(--bw) solid var(--ink); border-radius:4px; box-shadow:4px 4px 0 var(--shadow); padding:12px; margin-bottom:12px; position:relative}
body.night .todo{background:var(--paper)}
.todo.done{opacity:.62; background:var(--pink-pastel)}
.todo.dragging{opacity:.4; border-style:dashed}
.todo.over{box-shadow:0 -6px 0 -2px var(--pink-hot), 4px 4px 0 var(--shadow)}
.cb{flex:0 0 auto; width:28px; height:28px; border:var(--bw) solid var(--ink); border-radius:4px; background:var(--paper); cursor:pointer; display:grid; place-items:center; padding:0; box-shadow:2px 2px 0 var(--shadow)}
.cb svg{width:16px; height:16px; opacity:0; transform:scale(.3); transition:all .2s cubic-bezier(.2,1.6,.3,1)}
.cb.on{background:var(--ink)}
body.night .cb.on{background:var(--pink)}
.cb.on svg{opacity:1; transform:scale(1); color:var(--pink)}
body.night .cb.on svg{color:#111}
.td-title{font-weight:700; position:relative; display:inline-block}
.td-title::after{content:""; position:absolute; left:0; top:55%; height:3px; width:0; background:var(--ink); transition:width .28s ease-out}
.done .td-title::after{width:100%}
.td-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; align-items:center}
.grip{cursor:grab; color:var(--ink); opacity:.45; flex:0 0 auto; margin-top:2px; background:none; border:none; padding:2px}
.grip:active{cursor:grabbing}

/* ---------- notes ---------- */
.notes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px}
.note{border:var(--bw) solid var(--ink); border-radius:4px; box-shadow:5px 5px 0 var(--shadow); padding:12px; display:flex; flex-direction:column; gap:8px; min-height:170px; position:relative}
.note.n0{background:var(--pink-pastel)} .note.n1{background:var(--yellow)} .note.n2{background:var(--mint)} .note.n3{background:var(--lav)}
.note input{border-width:2px; padding:6px 8px; font-weight:800; background:rgba(255,255,255,.55); box-shadow:none}
body.night .note input, body.night .note textarea{background:rgba(0,0,0,.35)}
.note textarea{border-width:2px; padding:6px 8px; font-size:13px; background:rgba(255,255,255,.55); box-shadow:none; flex:1; min-height:70px}
.note .saved-ind{position:absolute; right:8px; top:8px; font-size:10px; font-weight:800; opacity:0; transition:opacity .3s}
.note .saved-ind.show{opacity:.7}
.note.pin{transform:rotate(-1.5deg); box-shadow:7px 7px 0 var(--shadow)}
.note-tools{display:flex; gap:6px; justify-content:flex-end}

/* ---------- agenda ---------- */
.cal{background:var(--paper); border:var(--bw) solid var(--ink); border-radius:4px; box-shadow:6px 6px 0 var(--shadow); padding:14px}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal-dow{font-size:11px; font-weight:800; text-align:center; opacity:.6; padding:4px 0; text-transform:uppercase}

.cal-day:hover{border-color:var(--ink)}
.cal-day.today{background:var(--pink); border-color:var(--ink); box-shadow:2px 2px 0 var(--ink)}
.cal-day.sel{border-color:var(--ink); background:var(--yellow)}
.cal-day.other{opacity:.3}
.cal-day.has::after{content:""; position:absolute; bottom:4px; width:6px; height:6px; border-radius:999px; background:var(--pink-hot); border:1px solid var(--ink)}

.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring-time{font-family:var(--f-display); font-weight:700; font-size:44px; letter-spacing:-1px; font-variant-numeric:tabular-nums}

/* ---------- bot ---------- */
.chat{display:flex; flex-direction:column; gap:12px; max-height:52vh; overflow-y:auto; padding:4px}
.msg{max-width:88%; padding:10px 14px; border:var(--bw) solid var(--ink); border-radius:4px; font-size:14px; white-space:pre-wrap; word-break:break-word}
.msg.user{align-self:flex-end; background:var(--ink); color:#fff; box-shadow:4px 4px 0 var(--pink); border-top-right-radius:0}
body.night .msg.user{background:var(--pink); color:#111; box-shadow:4px 4px 0 var(--shadow)}
.msg.bot{align-self:flex-start; background:var(--paper); box-shadow:4px 4px 0 var(--shadow); border-top-left-radius:0}
.msg.typing{display:flex; gap:6px; padding:14px}
.msg.typing i{width:8px; height:8px; background:var(--ink); border-radius:999px; animation:bnc 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s} .msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}

/* ---------- compare slider ---------- */
.compare{position:relative; user-select:none; overflow:hidden; border:var(--bw) solid var(--ink); box-shadow:6px 6px 0 var(--shadow); border-radius:4px; background:#fff}
.compare img{display:block; width:100%; height:auto}
.after-wrap{position:absolute; top:0; left:0; bottom:0; overflow:hidden; border-right:var(--bw) solid var(--ink)}
.after-wrap img{position:absolute; top:0; left:0; height:100%}
.cmp-tag{position:absolute; top:8px; font-size:11px; font-weight:800; border:2px solid #111; background:var(--yellow); padding:2px 8px; transform:rotate(-3deg); z-index:2}

.cmp-handle{position:absolute; top:0; bottom:0; width:6px; background:var(--pink-hot); border-inline:2px solid #111; transform:translateX(-4px); pointer-events:none}
.cmp-handle::after{content:"◂ ▸"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--pink); border:2px solid #111; font-size:10px; padding:2px 4px; white-space:nowrap; font-weight:900}

/* ---------- prayer ---------- */

.pray{border:var(--bw) solid var(--ink); border-radius:4px; padding:12px; text-align:center; background:var(--paper); box-shadow:4px 4px 0 var(--shadow); position:relative}
.pray.next{background:var(--pink); box-shadow:6px 6px 0 var(--shadow)}
.pray .pn{font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:1px}

.tgl{position:relative; width:52px; height:28px; flex:0 0 auto; border:var(--bw) solid var(--ink); border-radius:999px; background:var(--paper); cursor:pointer; box-shadow:2px 2px 0 var(--shadow); padding:0}

'use strict';
/* ================================================================
   RAYR4 BOT — single-file PWA (vanilla, zero build)
   Modul: Store → Utils → UI kit → Views → Engines → Router

/* ---------- 1. STORE (localStorage prefix rayr4:) ---------- */
const P = 'rayr4:';
const Store = {
  get(k, def){ try{ const v = localStorage.getItem(P+k); return v===null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(P+k, JSON.stringify(v)); }catch(e){ toast('Storage penuh — export & bersihkan data lama','err'); } },
  del(k){ localStorage.removeItem(P+k); },
  keys(){ const a=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(P)) a.push(k.slice(P.length)); } return a; }
};

const DEFAULT_SETTINGS = {
  name:'Owner', budgetDaily:50000,
  pomodoro:{focus:25, short:5, long:15},
  prayer:{enabled:true, city:'Jakarta', country:'Indonesia', notif5:true, alerts:{Subuh:true, Dzuhur:true, Ashar:true, Maghrib:true, Isya:true}},
  study:{enabled:true, hour:20},
  ai:{provider:'groq', model:'llama-3.1-8b-instant', key:''},
  theme:'light', askedNotif:false
};
function settings(){ const s = Store.get('settings', {}); return deepMerge(structuredClone(DEFAULT_SETTINGS), s); }
function saveSettings(s){ Store.set('settings', s); }
function deepMerge(base, over){ for(const k in over){ if(over[k] && typeof over[k]==='object' && !Array.isArray(over[k]) && base[k] && typeof base[k]==='object'){ deepMerge(base[k], over[k]); } else { base[k] = over[k]; } } return base; }

/* ---------- 2. UTILS ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n,a,b) => Math.min(b, Math.max(a,n));
function fmtRp(n){ const neg = n<0; const v = Math.abs(Math.round(n)).toLocaleString('id-ID'); return (neg?'-Rp':'Rp') + v; }
function todayStr(d=new Date()){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function tomorrowStr(){ const d=new Date(); d.setDate(d.getDate()+1); return todayStr(d); }
function addDaysStr(str, n){ const [y,m,d]=str.split('-').map(Number); const dt=new Date(y,m-1,d+n); return todayStr(dt); }
const DOW = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function niceDate(str){ const [y,m,d]=str.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
function dayDiff(a,b){ const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; const p=n=>String(n).padStart(2,'0'); return h>0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`; }

/* ---------- 3. ICONS (inline SVG, stroke 2.5) ---------- */
const IC = {

  note:'<path d="M4 4h13l3 3v13H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="1"/><path d="M3 10h18M16 15h2"/><path d="M3 6l12-3v3"/>',
  piggy:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',

  bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/>',
  bellOff:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/><path d="M3 3l18 18"/>',
  zap:'<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
  moon:'<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',

  warn:'<path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/>',
  grip:'<circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/>',
  sparkle:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M19 3v4M17 5h4"/>',
  coins:'<circle cx="8" cy="8" r="5"/><path d="M14.5 7.5a5 5 0 11-7 7"/><path d="M10 20h11M15 17h6M17 14h4"/>',

  download:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  mosque:'<path d="M12 2s4 3 4 6h-8c0-3 4-6 4-6z"/><path d="M4 22V12a8 8 0 0116 0v10"/><path d="M2 22h20"/><path d="M10 22v-4a2 2 0 014 0v4"/>',
  chart:'<path d="M3 21h18"/><rect x="5" y="12" width="4" height="8"/><rect x="11" y="8" width="4" height="12"/><rect x="17" y="4" width="4" height="16"/>'
};
function ic(name, size=20){ return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[name]||''}</svg>`; }

/* ---------- 4. TOAST / MODAL / SOUND / CONFETTI / NOTIFY ---------- */
function toast(msg, type='ok', ms=3200){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="flex:1">${esc(msg)}</span>`;
  const root = $('#toast-root'); root.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 320); }, ms);
}
function modal(html, onMount){
  const root = $('#modal-root');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  root.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if(e.key==='Escape') close(); };
  document.addEventListener('keydown', key);
  ov.addEventListener('click', e => { if(e.target===ov) close(); });
  $$('[data-close]', ov).forEach(b => b.addEventListener('click', close));
  if(onMount) onMount(ov.querySelector('.modal'), close);
  return close;
}
function ask(title, msg, okLabel='Ya, gas', danger=false){
  return new Promise(res => {
    modal(`<h2>${esc(title)}</h2><p class="muted" style="font-size:14px">${esc(msg)}</p>
      <div class="row mt2" style="justify-content:flex-end">
        <button class="btn btn-sm" data-close>Batal</button>
        <button class="btn btn-sm ${danger?'btn-danger':'btn-pink'}" id="ask-ok">${esc(okLabel)}</button>
      </div>`, (m, close) => {
      $('#ask-ok', m).addEventListener('click', () => { close(); res(true); });
      $$('[data-close]', m).forEach(b => b.addEventListener('click', () => res(false)));
    });
  });
}

let _ac = null;
function bell(){
  try{
    _ac = _ac || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = _ac.currentTime;
    [[880,0],[1318.5,0.18]].forEach(([f,dt])=>{
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, t0+dt);
      g.gain.exponentialRampToValueAtTime(0.35, t0+dt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dt+0.9);
      o.connect(g).connect(_ac.destination);
      o.start(t0+dt); o.stop(t0+dt+1);
    });
  }catch(e){}
}

function confetti(){
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#FF8FBF','#FFE55C','#A8E6CF','#B8A9FF','#FF6FA8','#111111'];
  const parts = Array.from({length:130}, () => ({
    x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.4,
    w: 6+Math.random()*8, h: 8+Math.random()*10,
    vy: 2.4+Math.random()*3.6, vx: -1.6+Math.random()*3.2,
    rot: Math.random()*Math.PI, vr: -0.12+Math.random()*0.24,
    col: colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(++frames < 190) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}

async function notify(title, body, tag){
  if(!('Notification' in window)) return toast('Browser ini tidak mendukung notifikasi','warn');
  if(Notification.permission !== 'granted') return;
  try{
    if(navigator.serviceWorker){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg && reg.showNotification){
        reg.showNotification(title, { body, tag, icon:'icons/icon-192.png', badge:'icons/icon-192-maskable.png', vibrate:[90,60,90], data:{url:'./'} });
        return;
      }
    }
    new Notification(title, { body, tag, icon:'icons/icon-192.png' });
  }catch(e){ try{ new Notification(title, { body, tag }); }catch(_){} }
}

/* ---------- 5. DATA LAYER ---------- */

/* streak belajar */
function streakData(){ return Store.get('streak', {last:null, count:0}); }
function recordStudySession(){
  const s = streakData(), t = todayStr();
  s.log = s.log || {};
  s.log[t] = (s.log[t]||0) + 1;
  if(s.last !== t){ s.count = (s.last === addDaysStr(t,-1)) ? s.count + 1 : 1; s.last = t; }
  Store.set('streak', s);
}

const S = { todoFilter:'all', calMonth:null, calSel:null, ups:{}, chat:{busy:false}, pomoTimer:null };
const PRIO = { high:['high','High'], med:['med','Med'], low:['low','Low'] };

function todoFilterList(){
  const all = getTodos();
  const t = todayStr(), b = tomorrowStr();
  if(S.todoFilter==='done') return all.filter(x=>x.done);
  let list = all.filter(x=>!x.done);
  if(S.todoFilter==='today') list = list.filter(x=>x.due && x.due<=t);
  if(S.todoFilter==='tomorrow') list = list.filter(x=>x.due===b);
  return list;
}

      const data = { title, desc:$('#td-d',m).value.trim(), priority:$('#td-p',m).value, due:$('#td-du',m).value||null, category:$('#td-c',m).value.trim() };
      const arr = getTodos();
      if(existing){ Object.assign(arr.find(x=>x.id===existing.id), data); }
      else { arr.unshift({id:uid(), done:false, createdAt:Date.now(), ...data}); }
      setTodos(arr);
      close(); rerender(); toast(existing?'Tugas diupdate':'Tugas ditambahkan','ok');
    });
    setTimeout(()=>$('#td-t',m).focus(), 50);
  });

function bindTodoDnD(){
  const list = $('#todo-list'); if(!list) return;
  let dragId = null;
  list.addEventListener('dragstart', e => {
    const el = e.target.closest('.todo'); if(!el) return;
    dragId = el.dataset.id; el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  list.addEventListener('dragend', e => {
    $$('.todo', list).forEach(x=>x.classList.remove('dragging','over'));
    const order = $$('.todo', list).map(x=>x.dataset.id);
    const all = getTodos();
    all.sort((a,b)=>{
      const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
      return (ia===-1?999:ia) - (ib===-1?999:ib);
    });
    setTodos(all); rerender();
  });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const over = e.target.closest('.todo'); if(!over || !dragId || over.dataset.id===dragId) return;
    $$('.todo', list).forEach(x=>x.classList.remove('over'));
    const rect = over.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height/2;
    const dragged = $(`.todo[data-id="${dragId}"]`, list);
    if(dragged) list.insertBefore(dragged, before ? over : over.nextSibling);
    over.classList.add('over');
  });
}

function chart14(){
  const days = []; const d = new Date();
  for(let i=13;i>=0;i--){ const dt=new Date(d); dt.setDate(d.getDate()-i); days.push(todayStr(dt)); }
  const totals = days.map(dstr=>moneyDay(dstr).reduce((a,e)=>a+e.amount,0));
  const max = Math.max(...totals, 1000);
  const W=560, H=170, bw=26, gap=(W-14*bw)/15;
  let bars='', labels='';
  days.forEach((dstr,i)=>{
    const h = Math.round(totals[i]/max*(H-46));
    const x = gap + i*(bw+gap);
    const isToday = dstr===todayStr();
    bars += `<rect x="${x}" y="${H-24-h}" width="${bw}" height="${Math.max(h,2)}" fill="${isToday?'var(--pink-hot)':totals[i]>0?'var(--pink)':'transparent'}" stroke="#111" stroke-width="2"><title>${niceDate(dstr)}: ${fmtRp(totals[i])}</title></rect>`;
    if(i%2===0) labels += `<text x="${x+bw/2}" y="${H-8}" font-size="9" text-anchor="middle" fill="#111">${dstr.slice(8)}</text>`;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart pengeluaran 14 hari">
    <line x1="4" y1="${H-24}" x2="${W-4}" y2="${H-24}" stroke="#111" stroke-width="2"/>
    ${bars}${labels}
    <text x="4" y="14" font-size="10" fill="#111">Max: ${fmtRp(max)}</text>
  </svg>`;
}

<script>
'use strict';
/* ---------- 12. VIEW + ENGINE: POMODORO ---------- */
const POMO_MODES = {
  focus:{label:'Fokus', color:'var(--pink-hot)'},
  short:{label:'Break Pendek', color:'var(--mint)'},
  long:{label:'Break Panjang', color:'var(--lav)'}
};
function pomoState(){ return Store.get('pomodoro', {mode:'focus', running:false, endsAt:null, remaining:null, cycle:0}); }
function pomoSave(s){ Store.set('pomodoro', s); }
function pomoDuration(){ const s = settings().pomodoro; const p = pomoState(); return {focus:s.focus, short:s.short, long:s.long}[p.mode] * 60; }
function pomoRemaining(){
  const p = pomoState();
  if(p.running) return Math.max(0, Math.round((p.endsAt - Date.now())/1000));
  return p.remaining !== null ? p.remaining : pomoDuration();
}

function vPomodoro(v){
  const p = pomoState();
  const dur = pomoDuration();
  v.innerHTML = `
  <div class="row spread wrap mb2"><div><h1>Pomodoro</h1><p class="muted">Sesi fokus selesai hari ini: ${Store.get('focusToday', 0)}</p></div>
  <span class="sticker pink">siklus ke-${p.cycle % 4 + 1}</span></div>
  <div class="card center" style="max-width:480px; margin:0 auto">
    <div class="row wrap mb2" style="justify-content:center" role="tablist" aria-label="Mode timer">
      ${['focus','short','long'].map(k=>`<button class="chip ${p.mode===k?'on':''}" data-act="pomo-mode" data-k="${k}" role="tab" aria-selected="${p.mode===k}">${POMO_MODES[k].label} (${settings().pomodoro[k]}m)</button>`).join('')}
    </div>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="88" fill="none" stroke-width="14"/>
        <circle class="ring-fg" id="pomo-ring" cx="100" cy="100" r="88" fill="none" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${(2*Math.PI*88).toFixed(1)}" stroke-dashoffset="0" transform="rotate(-90 100 100)" style="stroke:${POMO_MODES[p.mode].color}"/>
      </svg>
      <div class="ring-center">
        <span class="ring-time mono" id="pomo-time">--:--</span>
        <span class="small" style="font-weight:800; text-transform:uppercase; letter-spacing:1px">${POMO_MODES[p.mode].label}</span>
        <span class="small muted">${p.running?'lagi jalan':'siap gas'}</span>
      </div>
    </div>
    <div class="row mt2 wrap" style="justify-content:center">
      <button class="btn ${p.running?'btn-yellow':'btn-pink'}" data-act="pomo-toggle">${ic(p.running?'pause':'play',18)} ${p.running?'Pause':'Start'}</button>
      <button class="btn" data-act="pomo-reset">${ic('reset',18)} Reset</button>
      <button class="btn" data-act="pomo-skip">${ic('skip',18)} Skip</button>
    </div>
    <p class="small muted mt2">Notifikasi nyala otomatis tiap sesi selesai + bel bunyi. Refresh halaman gak bikin timer ilang.</p>
  </div>`;
  pomoPaint();
}
function pomoPaint(){
  const p = pomoState();
  const dur = pomoDuration(), rem = pomoRemaining();
  const t = $('#pomo-time'), ring = $('#pomo-ring');
  if(t) t.textContent = fmtClock(rem);
  if(ring){
    const C = 2*Math.PI*88;
    ring.style.strokeDashoffset = (C * (1 - rem/dur)).toFixed(1);
  }
}
function pomoToggle(){
  const p = pomoState();
  if(p.running){
    p.remaining = pomoRemaining();
    p.running = false; p.endsAt = null;
    toast('Timer di-pause','warn');
  } else {
    const rem = p.remaining !== null ? p.remaining : pomoDuration();
    p.endsAt = Date.now() + rem*1000;
    p.running = true; p.remaining = null;
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission();
    }
  }
  pomoSave(p); rerender();
}
function pomoReset(){ const p = pomoState(); p.running=false; p.endsAt=null; p.remaining=pomoDuration(); pomoSave(p); rerender(); }
function pomoSkip(){ pomoComplete(true); }
function pomoSwitch(mode){
  const p = pomoState();
  p.mode = mode; p.running=false; p.endsAt=null; p.remaining=null;
  pomoSave(p); rerender();
}
function pomoTick(){
  const p = pomoState();
  if(p.running){
    if(Date.now() >= p.endsAt) pomoComplete(false);
    else pomoPaint();
  }
}
function pomoComplete(skipped){
  const p = pomoState();
  const finished = p.mode;
  if(finished === 'focus' && !skipped){
    recordStudySession();
    Store.set('focusToday', Store.get('focusToday',0)+1);
    confetti();
  }
  bell();
  const pset = settings().pomodoro;
  if(finished === 'focus'){
    notify('Sesi fokus selesai!', `Gawe kelar. Waktunya break ${skipped?pset[ p.cycle%4===3?'long':'short']:undefined || pset[(p.cycle+1)%4===0?'long':'short']} menit. Push dulu, rebahan belakangan.`, 'pomo');
  } else {
    notify('Break selesai!', 'Balik lagi ke mode fokus. Satu langkah lagi menuju hari yang produktif.', 'pomo');
  }
  // next mode
  let next;
  if(finished === 'focus'){
    p.cycle = (p.cycle||0) + 1;
    next = (p.cycle % 4 === 0) ? 'long' : 'short';
  } else next = 'focus';
  p.mode = next; p.running = false; p.endsAt = null; p.remaining = null;
  pomoSave(p);
  if(location.hash.includes('pomodoro')) rerender(); else pomoPaint();
}

const SYS_PROMPT = 'Kamu RAYR4 Bot, asisten personal yang to-the-point, santai, pakai bahasa Indonesia sehari-hari, kadang selipkan humor kering. Jangan bertele-tele. Jawab maksimal 8 kalimat kecuali diminta detail.';

  'Matikan notifikasi sosmed pas pomodoro fokus. Serius, ini peningkat #1.',

  'Kadang "gak mood" cuma butuh start 5 menit. Mulai aja dulu, mood nyusul.',

function chatHistory(){ return Store.get('chat', []); }
function pushChat(role, content){ const h = chatHistory(); h.push({role, content, ts:Date.now()}); Store.set('chat', h.slice(-60)); }

  const s = settings().ai;

function botContext(){
  const s = settings();

  const rem = (s.budgetDaily||0) - spentToday();

}
async function sendChat(overrideText){
  const input = $('#chat-in');
  const text = (overrideText !== undefined ? overrideText : input.value).trim();
  if(!text || S.chat.busy) return;
  if(input) input.value='';
  if(overrideText !== undefined && $('#chat-in')) $('#chat-in').value = overrideText.replace(/:$/, '') ? '' : '';
  S.chat.busy = true;
  pushChat('user', text);
  const box = $('#chat-box');
  if(box){
    box.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(text)}</div><div class="msg bot typing" id="chat-ty"><i></i><i></i><i></i></div>`);
    box.scrollTop = box.scrollHeight;
  }
  const s = settings().ai;
  let reply = '';
  try{
    if(s.key){
      reply = await streamAI(s, text, tok => {
        const ty = $('#chat-ty');
        if(ty){ ty.classList.remove('typing'); ty.textContent = (ty.textContent||'') + tok; if(box) box.scrollTop = box.scrollHeight; }
      });
    } else {
      await new Promise(r=>setTimeout(r, 600));
      reply = offlineReply(text);
    }
  }catch(err){
    reply = offlineReply(text);
    toast('API gagal ('+(err.message||'error')+') — fallback offline tips', 'err');
  }
  pushChat('assistant', reply);
  const ty = $('#chat-ty');
  if(ty){ ty.remove(); }
  if(box){
    box.insertAdjacentHTML('beforeend', `<div class="msg bot">${esc(reply)}</div>`);
    box.scrollTop = box.scrollHeight;
  }
  S.chat.busy = false;
}
function offlineReply(text){

async function streamAI(aiCfg, userText, onToken){
  const hist = chatHistory().slice(-10);
  const messages = [{role:'system', content: SYS_PROMPT + ' ' + botContext()}, ...hist.map(m=>({role:m.role, content:m.content}))];
  if(aiCfg.provider === 'gemini'){
    const sys = SYS_PROMPT + ' ' + botContext();
    const contents = hist.slice(0,-1).map(m=>({role: m.role==='user'?'user':'model', parts:[{text:m.content}]}));
    contents.push({role:'user', parts:[{text:userText}]});
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(aiCfg.model||'gemini-2.0-flash')}:streamGenerateContent?alt=sse&key=${encodeURIComponent(aiCfg.key)}`;
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ system_instruction:{parts:[{text:sys}]}, contents, generationConfig:{temperature:0.7, maxOutputTokens:600} })});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let out = '';
    for await (const delta of sseStream(res)){
      const j = JSON.parse(delta);
      const t = (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      if(t){ out += t; onToken(t); }
    }
    return out || '…';
  }
  // default: Groq (OpenAI-compatible)
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+aiCfg.key},
    body: JSON.stringify({ model: aiCfg.model || 'llama-3.1-8b-instant', messages, stream:true, temperature:0.7, max_tokens:600 })
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  let out = '';
  for await (const delta of sseStream(res)){
    if(delta === '[DONE]') break;
    try{ const j = JSON.parse(delta); const t = j.choices?.[0]?.delta?.content || ''; if(t){ out += t; onToken(t); } }catch(e){}
  }
  return out || '…';
}
async function* sseStream(res){
  const rd = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while(true){
    const {done, value} = await rd.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split('\n');
    buf = lines.pop();
    for(const line of lines){
      const l = line.trim();
      if(l.startsWith('data:')) yield l.slice(5).trim();
    }
  }
}

function loadUpFile(file){
  if(!file || !file.type.startsWith('image/')) return toast('Bukan file gambar','warn');
  if(file.size > 15*1024*1024) return toast('File kegedean (max 15MB)','err');
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      S.ups = { src:rd.result, w:img.naturalWidth, h:img.naturalHeight, size:file.size, scale:2, busy:false, result:null };
      rerender();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function sharpenChunk(ctx, y0, y1, k){
  const W = ctx.canvas.width;
  const src = ctx.getImageData(0, Math.max(0,y0-1), W, Math.min(ctx.canvas.height, y1+2) - Math.max(0,y0-1));
  const out = ctx.createImageData(W, y1-y0);
  const s = src.data, o = out.data, sw = src.width;
  for(let y=1; y<y1-y0+1; y++){
    for(let x=1; x<W-1; x++){
      const i = (y*sw + x)*4;
      for(let c=0;c<3;c++){
        const c0 = s[i+c], up = s[i-sw*4+c], dn = s[i+sw*4+c], lf = s[i-4+c], rt = s[i+4+c];
        o[i+c] = clamp(c0*(1+4*k) - k*(up+dn+lf+rt), 0, 255);
      }
      o[i+3] = s[i+3];
    }
  }
  return out;
}
async function doUpscale(){
  const u = S.ups;
  if(!u.src || u.busy) return;
  u.busy = true; u.result = null; rerender();
  const img = new Image();
  await new Promise(r=>{ img.onload=r; img.src=u.src; });
  let scale = Number(u.scale||2);
  let outW = img.naturalWidth*scale, outH = img.naturalHeight*scale;
  u.capped = false;
  if(Math.max(outW,outH) > 4096){ const f = 4096/Math.max(outW,outH); outW=Math.round(outW*f); outH=Math.round(outH*f); u.capped=true; }
  const cv = document.createElement('canvas');
  cv.width = outW; cv.height = outH;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  // stepwise upscale (halving steps keeps edges cleaner than one big jump)
  let cur = document.createElement('canvas');
  cur.width = img.naturalWidth; cur.height = img.naturalHeight;
  cur.getContext('2d').drawImage(img, 0, 0);
  while(cur.width * 2 <= outW){
    const nxt = document.createElement('canvas');
    nxt.width = cur.width*2; nxt.height = cur.height*2;
    nxt.getContext('2d').imageSmoothingQuality='high';
    nxt.getContext('2d').drawImage(cur, 0, 0, nxt.width, nxt.height);
    cur = nxt;
    await new Promise(r=>setTimeout(r));
  }
  ctx.drawImage(cur, 0, 0, outW, outH);
  // unsharp mask, chunked biar UI gak beku
  const K = 0.35;
  const chunk = Math.max(64, Math.floor(400000 / outW));
  for(let y=1; y<outH-1; y+=chunk){
    const y1 = Math.min(outH-1, y+chunk);
    const res = sharpenChunk(ctx, y, y1, K);
    ctx.putImageData(res, 0, y);
    const prog = $('#ups-prog');
    if(prog) prog.style.width = Math.round(y/outH*100)+'%';
    await new Promise(r=>setTimeout(r));
  }
  u.busy = false;
  u.outW = outW; u.outH = outH;
  u.result = cv;
  u.resultURL = cv.toDataURL('image/png');
  rerender();
  toast('Selesai! '+outW+'×'+outH+'px siap didownload','ok');
}
function downloadUps(){
  const u = S.ups; if(!u.result) return;
  u.result.toBlob(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rayr4-upscale-${Date.now()}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}

<script>
'use strict';
/* ---------- 15. ENGINE: PRAYER TIMES (Aladhan, cache 1 bulan) ---------- */
const PRAYER_NAMES = ['Subuh','Dzuhur','Ashar','Maghrib','Isya'];
const ALADHAN_MAP = { Subuh:'Fajr', Dzuhur:'Dhuhr', Ashar:'Asr', Maghrib:'Maghrib', Isya:'Isha' };

async function fetchPrayerSchedule(y, m){
  const s = settings().prayer;
  const cache = Store.get('prayerSchedule', null);
  if(cache && cache.city===s.city && cache.year===y && cache.month===m && Date.now()-cache.fetchedAt < 20*864e5){
    return cache;
  }
  const url = `https://api.aladhan.com/v1/calendarByCity?city=${encodeURIComponent(s.city)}&country=${encodeURIComponent(s.country)}&method=20&month=${m}&year=${y}`;
  const res = await fetch(url);
  const j = await res.json();
  if(!j || j.code !== 200 || !j.data) throw new Error('jadwal gagal diambil');
  const timings = {};
  j.data.forEach(d => {
    const [dd, mm, yy] = d.date.gregorian.date.split('-'); // DD-MM-YYYY
    const key = `${yy}-${mm}-${dd}`;
    timings[key] = {};
    PRAYER_NAMES.forEach(n => {
      const raw = d.timings[ALADHAN_MAP[n]] || '';
      timings[key][n] = raw.split(' ')[0];
    });
  });
  const data = { city:s.city, country:s.country, year:y, month:m, timings, fetchedAt:Date.now(), method:20 };
  Store.set('prayerSchedule', data);
  return data;
}
function prayerTimingsFor(dateStr, sched){
  if(!sched) return null;
  let t = sched.timings[dateStr];
  if(!t){ // bulan ganti — coba fetch, fallback jadwal terakhir
    t = sched.timings[Object.keys(sched.timings).pop()];
  }
  return t || null;
}
function prayerDate(name, dateStr, timings){
  const [y,mo,d] = dateStr.split('-').map(Number);
  const [h,mi] = timings[name].split(':').map(Number);
  return new Date(y, mo-1, d, h, mi, 0);
}
function nextPrayer(){
  const sched = Store.get('prayerSchedule', null);
  if(!sched) return null;
  const now = new Date();
  for(let off=0; off<=1; off++){
    const dstr = off===0 ? todayStr() : tomorrowStr();
    const t = prayerTimingsFor(dstr, sched);
    if(!t) continue;
    for(const name of PRAYER_NAMES){
      const pt = prayerDate(name, dstr, t);
      if(pt > now) return {name, at:pt, in:Math.round((pt-now)/1000)};
    }
  }
  return null;
}
function paintPrayerCountdowns(){
  const np = nextPrayer();
  if(!np) return;
  const dash = $('#dash-pray'), dashName = $('#dash-pray-name');
  if(dash) dash.textContent = fmtClock(np.in);
  if(dashName) dashName.textContent = `Menuju ${np.name} • ${np.at.toTimeString().slice(0,5)}`;
  $$('[data-countdown]').forEach(el => {
    const name = el.dataset.countdown, dstr = el.dataset.pdate;
    const sched = Store.get('prayerSchedule', null);
    const t = sched && prayerTimingsFor(dstr, sched);
    if(!t || !t[name]) return;
    const pt = prayerDate(name, dstr, t);
    let diff = Math.round((pt - new Date())/1000);
    if(diff < 0) diff = 0;
    el.textContent = fmtClock(diff);
  });
}

/* ---------- 16. ENGINE: REMINDERS (belajar 20:00 & sholat) ---------- */
function notifLog(){ return Store.get('notifLog', {}); }
function logNotif(key){ const l = notifLog(); l[key] = true; Store.set('notifLog', l); }
function cleanNotifLog(){
  const l = notifLog(); const t = todayStr();
  Object.keys(l).forEach(k => { if(!k.startsWith(t)) delete l[k]; });
  Store.set('notifLog', l);
}
function engineTick(){
  cleanNotifLog();
  const now = new Date();
  const dow = now.getDay(); // 0=Min
  const s = settings();

  // A. pengingat belajar: Sen-Sab, jam setting (default 20:00), window 1 jam
  if(s.study.enabled && dow >= 1 && dow <= 6){
    const t = todayStr();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), s.study.hour, 0, 0);
    const end = new Date(start.getTime() + 3600e3);
    if(now >= start && now < end && !notifLog()[t+'-study']){
      logNotif(t+'-study');
      const q = randomQuote();
      notify('Waktunya belajar!', `${q[0]} — ${q[1]}\n\nAyo mulai sesi belajar 25 menit. Kamu bisa.`, 'study');
      bell();
    }
  }

  // B. sholat: notifikasi 5 menit sebelum + tepat waktu
  const sched = Store.get('prayerSchedule', null);
  if(s.prayer.enabled && sched){
    const dstr = todayStr();
    const times = prayerTimingsFor(dstr, sched);
    if(times){
      PRAYER_NAMES.forEach(name => {
        if(!s.prayer.alerts[name]) return;
        const pt = prayerDate(name, dstr, times);
        const diffMin = Math.round((pt - now)/60000);
        if(diffMin === 5 || diffMin === 4){
          if(s.prayer.notif5 && !notifLog()[`${dstr}-${name}-pre`]){
            logNotif(`${dstr}-${name}-pre`);
            notify(`${name} 5 menit lagi`, `Siapkan diri — ${name} pukul ${times[name]} di ${sched.city}.`, 'pray-pre-'+name);
            bell();
          }
        }
        if(diffMin === 0 || (diffMin === -1)){
          if(!notifLog()[`${dstr}-${name}-azan`]){
            logNotif(`${dstr}-${name}-azan`);
            notify(`Waktunya ${name}`, `Adzan ${name} telah masuk di ${sched.city}.`, 'pray-azan-'+name);
            bell();
          }
        }
      });
    }
  }
}

      <label class="fld" for="st-ai-m">Model</label>
      <input id="st-ai-m" value="${esc(s.ai.model)}" placeholder="llama-3.1-8b-instant / gemini-2.0-flash" />
      <label class="fld" for="st-ai-k">API key <span class="muted">(disimpan lokal di browser kamu — setara VITE_AI_API_KEY, jangan hardcode di kode)</span></label>
      <input id="st-ai-k" type="password" value="${esc(s.ai.key)}" placeholder="gsk_… / AIza…" />
      <button class="btn btn-pink mt2" data-act="ai-save">${ic('check',16)} Simpan AI</button>
      <p class="small muted mt1">Key kosong = mode offline tips tetap jalan.</p>
    </div>

    <div class="card">
      <h2>Kutipan motivasi</h2>
      <p class="small muted">Satu kutipan per baris, format: <code>teks | penulis</code></p>
      <textarea id="st-quotes" rows="7">${esc(getQuotes().map(q=>q.join(' | ')).join('\n'))}</textarea>
      <button class="btn btn-sm btn-yellow mt1" data-act="quotes-save">${ic('check',14)} Simpan kutipan</button>
    </div>

    <div class="card">
      <h2>PWA & Data</h2>
      <div class="switch-row"><span>Install app di HP <span class="muted small">(butuh hosting HTTPS)</span></span>
        <button class="btn btn-sm btn-pink" data-act="pwa-install" ${deferredPrompt?'':'disabled'}>${ic('down',14)} Install</button></div>
      <div class="row mt2 wrap">
        <button class="btn btn-sm btn-mint" data-act="export">${ic('down',14)} Export JSON</button>
        <button class="btn btn-sm" data-act="import">${ic('up',14)} Import JSON</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
      </div>
      <div class="row mt2"><button class="btn btn-sm btn-danger" data-act="reset-all">${ic('trash',14)} Reset semua data</button></div>
      <p class="small muted mt2">Semua data disimpan di localStorage (prefix <code>rayr4:</code>). Export rutin kalau mau ganti HP/browser.</p>
    </div>
  </div>

  <div class="card mt2">
    <h2>Jadwal sholat hari ini</h2>
    <div id="pray-wrap">${prayerCardsHTML()}</div>
  </div>`;
}
</script>

<script>
'use strict';
/* ---------- 19. ACTIONS (event delegation) ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstallBanner(); });

function showInstallBanner(){
  $('#banner-root').innerHTML = `
  <div class="install-banner card card-soft">
    <div class="row">
      <div class="logo-mark" style="flex:0 0 auto">R4</div>
      <div style="flex:1">
        <b>Install RAYR4 Bot</b>
        <p class="small muted" style="margin:0">Pasang di home screen — buka lebih cepat, notifikasi jalan.</p>
      </div>
    </div>
    <div class="row mt1" style="justify-content:flex-end">
      <button class="btn btn-sm" data-act="pwa-later">Nanti</button>
      <button class="btn btn-sm btn-pink" data-act="pwa-install">${ic('down',14)} Install</button>
    </div>
  </div>`;
}

const ACTIONS = {
  noop(){},
  'ask-notif'(){
    if(!('Notification' in window)) return toast('Browser tidak mendukung notifikasi','warn');
    Notification.requestPermission().then(p => {
      if(p==='granted'){ toast('Notifikasi aktif!','ok'); notify('RAYR4 Bot siap!', 'Notifikasi lokal sekarang jalan: pengingat belajar, adzan, dan pomodoro.', 'welcome'); rerender(); }
      else toast('Izin notifikasi ditolak — bisa diaktifkan lagi dari setting browser','warn');
    });
  },
  'quick-todo'(){ nav('todos'); setTimeout(()=>todoModal(null), 80); },
  'quick-note'(){ const a = getNotes(); a.unshift({ id:uid(), title:'', body:'', color:a.length%4, pinned:false, updatedAt:Date.now() }); setNotes(a); nav('notes'); },
  'quick-expense'(){ nav('money'); setTimeout(()=>expenseModal(), 80); },
  'go-pomo'(){ nav('pomodoro'); },
  'go-agenda'(){ nav('agenda'); },
  'go-savings'(){ nav('savings'); },

  'todo-filter'(el){ S.todoFilter = el.dataset.k; rerender(); },
  'todo-toggle'(el){
    const arr = getTodos();
    const t = arr.find(x=>x.id===el.dataset.id);
    if(!t) return;
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
    setTodos(arr);
    el.closest('.todo').classList.toggle('done', t.done);
    el.classList.toggle('on', t.done);
    el.setAttribute('aria-checked', t.done);
    if(t.done) toast('Sip, satu beres!','ok',1800);
    setTimeout(rerender, 500);
  },
  'todo-edit'(el){ todoModal(getTodos().find(x=>x.id===el.dataset.id)); },
  async 'todo-del'(el){
    const t = getTodos().find(x=>x.id===el.dataset.id);
    if(t && await ask('Hapus tugas?', `Yakin hapus "${t.title}"?`, 'Hapus', true)){
      setTodos(getTodos().filter(x=>x.id!==el.dataset.id)); rerender(); toast('Tugas dihapus','warn');
    }
  },
  'todo-move'(el){
    const all = getTodos(); const i = all.findIndex(x=>x.id===el.dataset.id);
    const j = i + Number(el.dataset.d);
    if(i<0 || j<0 || j>=all.length) return;
    [all[i], all[j]] = [all[j], all[i]];
    setTodos(all); rerender();
  },

  'note-add'(){
    const a = getNotes(); a.unshift({ id:uid(), title:'', body:'', color:a.length%4, pinned:false, updatedAt:Date.now() }); setNotes(a); rerender();
    const first = $('.note input[data-note-field="title"]'); if(first) first.focus();
  },
  'note-pin'(el){ const narr = getNotes(); const n = narr.find(x=>x.id===el.dataset.id); if(n){ n.pinned=!n.pinned; n.updatedAt=Date.now(); setNotes(narr); rerender(); } },
  'note-color'(el){ const narr = getNotes(); const n = narr.find(x=>x.id===el.dataset.id); if(n){ n.color=(n.color+1)%NOTE_COLORS; n.updatedAt=Date.now(); setNotes(narr); rerender(); } },
  async 'note-del'(el){
    if(await ask('Hapus catatan?','Catatan ini bakal hilang permanen.','Hapus', true)){
      setNotes(getNotes().filter(x=>x.id!==el.dataset.id)); rerender(); toast('Catatan dihapus','warn');
    }
  },

  'cal-pick'(el){ S.calSel = el.dataset.d; rerender(); },
  'cal-nav'(el){
    let {y, m} = S.calMonth;
    m += Number(el.dataset.d);
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    S.calMonth = {y, m}; rerender();
  },
  'ev-add'(){
    const t = $('#ev-t').value.trim();
    if(!t) return toast('Judul agenda wajib diisi','warn');
    const a = getEvents();
    a.push({ id:uid(), date:S.calSel, title:t, time:$('#ev-time').value||null, createdAt:Date.now() });
    setEvents(a); rerender(); toast('Agenda ditambahkan','ok');
  },
  async 'ev-del'(el){
    if(await ask('Hapus agenda?','', 'Hapus', true)){
      setEvents(getEvents().filter(x=>x.id!==el.dataset.id)); rerender();
    }
  },

  'exp-add'(){ expenseModal(); },
  async 'exp-del'(el){
    if(await ask('Hapus transaksi?','', 'Hapus', true)){
      setExpenses(getExpenses().filter(x=>x.id!==el.dataset.id)); rerender();
    }
  },
  'budget-set'(){
    const v = Math.max(0, Math.round(Number($('#bd-set').value||0)));
    const s = settings(); s.budgetDaily = v; saveSettings(s);
    rerender(); toast('Budget harian: '+fmtRp(v),'ok');
  },

  'goal-add'(){ goalModal(null); },
  'goal-edit'(el){ goalModal(getSavings().find(x=>x.id===el.dataset.id)); },
  async 'goal-del'(el){
    if(await ask('Hapus goal?','Riwayat deposit di goal ini ikut hilang.','Hapus', true)){
      setSavings(getSavings().filter(x=>x.id!==el.dataset.id)); rerender();
    }
  },
  'dep-add'(el){ depositModal(getSavings().find(x=>x.id===el.dataset.id)); },
  async 'dep-del'(el){
    const garr = getSavings();
    const g = garr.find(x=>x.id===el.dataset.id); if(!g) return;
    const d = g.deposits.find(x=>x.id===el.dataset.did); if(!d) return;
    if(await ask('Hapus deposit?', `Saldo goal berkurang ${fmtRp(d.amount)}.`, 'Hapus', true)){
      g.deposits = g.deposits.filter(x=>x.id!==el.dataset.did);
      g.current -= d.amount;
      g.celebrated = g.current >= g.target ? g.celebrated : false;
      setSavings(garr); rerender();
    }
  },

  'pomo-mode'(el){ pomoSwitch(el.dataset.k); },
  'pomo-toggle'(){ pomoToggle(); },
  'pomo-reset'(){ pomoReset(); },
  'pomo-skip'(){ pomoSkip(); },

  'chat-send'(){ sendChat(); },
  'chat-quick'(el){ sendChat(el.dataset.q); },
  async 'chat-clear'(){
    if(await ask('Hapus semua chat?','Riwayat percakapan kosong total.','Hapus', true)){
      Store.set('chat', []); rerender();
    }
  },

  'ups-go'(){ doUpscale(); },
  'ups-new'(){ S.ups = {}; rerender(); },
  'ups-dl'(){ downloadUps(); },

  'settings-save'(){
    const s = settings();
    s.name = $('#st-name').value.trim() || 'Owner';
    s.budgetDaily = Math.max(0, Math.round(Number($('#st-budget').value||0)));
    s.theme = $('#st-theme').value;
    s.pomodoro.focus = clamp(Math.round(Number($('#st-pf').value)||25), 1, 120);
    s.pomodoro.short = clamp(Math.round(Number($('#st-ps').value)||5), 1, 30);
    s.pomodoro.long  = clamp(Math.round(Number($('#st-pl').value)||15), 1, 60);
    s.study.hour = clamp(Number($('#st-hour').value)||20, 0, 23);
    saveSettings(s); applyTheme();
    toast('Preferensi tersimpan','ok'); rerender();
  },
  'tgl-study'(el){
    const s = settings(); s.study.enabled = !s.study.enabled; saveSettings(s);
    el.classList.toggle('on', s.study.enabled); el.setAttribute('aria-checked', s.study.enabled);
    toast(s.study.enabled?`Pengingat belajar ON jam ${String(s.study.hour).padStart(2,'0')}:00 (Sen–Sab)`:'Pengingat belajar OFF', s.study.enabled?'ok':'warn');
  },
  'tgl-prayer'(el){
    const s = settings(); s.prayer.enabled = !s.prayer.enabled; saveSettings(s);
    el.classList.toggle('on', s.prayer.enabled); el.setAttribute('aria-checked', s.prayer.enabled);
    toast(s.prayer.enabled?'Notifikasi adzan ON':'Notifikasi adzan OFF', s.prayer.enabled?'ok':'warn');
  },
  'pray-toggle'(el){
    const s = settings();
    s.prayer.alerts[el.dataset.k] = !s.prayer.alerts[el.dataset.k];
    saveSettings(s);
    el.classList.toggle('on', s.prayer.alerts[el.dataset.k]);
    el.setAttribute('aria-checked', s.prayer.alerts[el.dataset.k]);
  },
  async 'prayer-save'(){
    const s = settings();
    s.prayer.city = $('#st-city').value.trim() || 'Jakarta';
    s.prayer.country = $('#st-country').value.trim() || 'Indonesia';
    saveSettings(s);
    Store.del('prayerSchedule');
    toast(`Mengambil jadwal ${s.prayer.city}…`,'warn');
    try{
      const d = new Date();
      await fetchPrayerSchedule(d.getFullYear(), d.getMonth()+1);
      rerender(); toast('Jadwal sholat diperbarui','ok');
    }catch(e){ toast('Gagal ambil jadwal — cek koneksi atau nama kota','err'); rerender(); }
  },
  'ai-save'(){
    const s = settings();
    s.ai.provider = $('#st-ai-p').value;
    s.ai.model = $('#st-ai-m').value.trim();
    s.ai.key = $('#st-ai-k').value.trim();
    saveSettings(s);
    toast(s.ai.key?'AI online — key tersimpan lokal':'Key kosong → mode offline tips','ok');
  },
  'quotes-save'(){
    const raw = $('#st-quotes').value.split('\n').map(l=>l.trim()).filter(Boolean)
      .map(l=>{ const [t, a] = l.split('|').map(x=>(x||'').trim()); return [t||'…', a||'Anonim']; });
    if(!raw.length) return toast('Minimal satu kutipan','warn');
    Store.set('quotes', raw);
    toast(raw.length+' kutipan tersimpan','ok');
  },
  'pwa-install'(){
    if(!deferredPrompt) return toast('Install otomatis belum tersedia — pakai menu browser: "Add to Home screen"','warn');
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; $('#banner-root').innerHTML=''; rerender(); });
  },
  'pwa-later'(){ $('#banner-root').innerHTML=''; },
  'export'(){
    const o = {}; Store.keys().forEach(k => o[k] = localStorage.getItem(P+k));
    const blob = new Blob([JSON.stringify({app:'RAYR4 Bot', version:1, data:o}, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rayr4-backup-${todayStr()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Backup JSON didownload','ok');
  },
  'import'(){ $('#import-file').click(); },
  async 'reset-all'(){
    if(await ask('Reset SEMUA data?','To-do, catatan, keuangan, tabungan — semua hilang. Export dulu kalau ragu.','Reset semua', true)){
      Store.keys().forEach(k => Store.del(k));
      location.reload();
    }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.act];
  if(fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  const el = e.target.closest('[data-act][role="switch"]');
  if(el && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); const fn = ACTIONS[el.dataset.act]; if(fn) fn(el, e); }
});

/* ---------- 20. ROUTER + NAV ---------- */
const NAV = [
  ['dashboard','Home','home'], ['todos','To-Do','todo'], ['notes','Notes','note'],
  ['agenda','Agenda','cal'], ['money','Uang','wallet'], ['savings','Tabungan','piggy'],
  ['pomodoro','Pomodoro','timer'], ['bot','Bot','bot'], ['upscale','HD Upscale','image'],
  ['settings','Setting','gear']
];
const VIEWS = { dashboard:vDashboard, todos:vTodos, notes:vNotes, agenda:vAgenda, money:vMoney, savings:vSavings, pomodoro:vPomodoro, bot:vBot, upscale:vUpscale, settings:vSettings };
function route(){ return (location.hash.replace(/^#\/?/, '') || 'dashboard'); }
function nav(r){ location.hash = '#/' + r; }
function rerender(){ render(); }
function render(){
  const r = route();
  const view = $('#view');
  (VIEWS[r] || vDashboard)(view);
  if(!VIEWS[r]) location.hash = '#/dashboard';
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  renderNav(r);
  window.scrollTo({top:0});
}
function renderNav(r){
  $('#side').innerHTML = `
    <div class="logo"><div class="logo-mark">R4</div>
      <div><div style="font-family:var(--f-display); font-weight:700; font-size:18px; line-height:1">RAYR4 Bot</div>
      <div class="small muted">brutal daily assistant</div></div></div>
    <nav>${NAV.map(([k,l,i])=>`<a href="#/${k}" class="${r===k?'on':''}">${ic(i,16)} ${l}</a>`).join('')}</nav>
    <div class="card pad-sm mt3 card-yellow" style="box-shadow:3px 3px 0 var(--shadow)">
      <b class="small">🔥→⚡ Streak</b>
      <div class="big-num" style="font-size:26px">${streakData().count} hari</div>
      <div class="small muted">belajar beruntun</div>
    </div>`;
  $('#bottomnav').innerHTML = NAV.slice(0,9).map(([k,l,i])=>`<a href="#/${k}" class="${r===k?'on':''}" aria-label="${l}">${ic(i,20)}<span>${l}</span></a>`).join('');
}

/* ---------- 21. THEME + INIT ---------- */
function applyTheme(){ document.body.classList.toggle('night', settings().theme==='night'); }
window.addEventListener('hashchange', render);

function init(){
  applyTheme();
  render();
  // pomo engine: 1s
  setInterval(() => { pomoTick(); paintPrayerCountdowns(); }, 1000);
  // reminder engine: 20s + saat tab aktif lagi
  setInterval(engineTick, 20000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) engineTick(); });
  // izin notifikasi: hanya saat user pertama aktif, bukan saat load
  document.addEventListener('pointerdown', function firstTouch(){
    document.removeEventListener('pointerdown', firstTouch);
    const s = settings();
    if('Notification' in window && Notification.permission==='default' && !s.askedNotif){
      s.askedNotif = true; saveSettings(s);
      modal(`<h2>Aktifkan notifikasi?</h2>
      <p class="muted small">RAYR4 Bot pakai ini buat:</p>
      <ul class="small" style="padding-left:18px">
        <li>Pengingat belajar Sen–Sab jam ${String(s.study.hour).padStart(2,'0')}:00</li>
        <li>Notifikasi adzan (5 menit sebelum + tepat waktu)</li>
        <li>Alarm pomodoro & tabungan tercapai</li>
      </ul>
      <p class="small muted">Semua notifikasi dikirim lokal dari perangkatmu, bukan server.</p>
      <div class="row mt2" style="justify-content:flex-end">
        <button class="btn btn-sm" data-close>Nanti</button>
        <button class="btn btn-sm btn-pink" id="notif-ok">${ic('bell',14)} Aktifkan</button>
      </div>`, (m) => {
        $('#notif-ok', m).addEventListener('click', () => ACTIONS['ask-notif']());
      });
    }
  });
  // PWA service worker (jalan hanya kalau di-host HTTPS/localhost)
  if('serviceWorker' in navigator && (location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  // jadwal sholat: ambil bulan ini (cache 1 bulan)
  const d = new Date();
  fetchPrayerSchedule(d.getFullYear(), d.getMonth()+1).then(() => {
    paintPrayerCountdowns();
    const wrap = $('#pray-wrap');
    if(wrap) wrap.innerHTML = prayerCardsHTML();
    if(route()==='dashboard' && !$('#dash-pray')) return;
  }).catch(() => {
    const dashName = $('#dash-pray-name');
    if(dashName) dashName.textContent = 'jadwal gagal dimuat (offline?)';
    const wrap = $('#pray-wrap');
    if(wrap) wrap.innerHTML = `<div class="empty">${ic('warn',22)}<br>Gagal ambil jadwal (butuh internet). Coba lagi di Pengaturan → Simpan kota.</div>`;
  });
  window.addEventListener('beforeunload', () => { const p = pomoState(); if(p.running){ p.remaining = pomoRemaining(); pomoSave(p); } });
}
init();
</script>
</body>
</html>
